name: YouTube Token Health Check

# Daily early-warning check. It does NOT keep the token alive (Google tokens
# don't need that once the OAuth app is "In production") - it tells you the
# day the token dies instead of the day a video fails. On failure it opens a
# GitHub issue (GitHub emails you) with the exact fix.
on:
  schedule:
    - cron: "17 5 * * *"   # ~10:47 AM IST, well before the 12:07 PM IST upload job
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Google client libraries
        run: python -m pip install --quiet google-auth google-api-python-client
      - name: Refresh token and call YouTube API
        id: probe
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          raw = os.environ.get("GOOGLE_CREDENTIALS", "").strip()
          if not raw:
              print("ERROR: GOOGLE_CREDENTIALS secret is empty."); sys.exit(1)
          try:
              data = json.loads(raw)
              creds = Credentials.from_authorized_user_info(data, [
                  "https://www.googleapis.com/auth/youtube.upload",
                  "https://www.googleapis.com/auth/youtube",
                  "https://www.googleapis.com/auth/youtube.force-ssl",
              ])
              creds.refresh(Request())
              items = build("youtube", "v3", credentials=creds, cache_discovery=False) \
                  .channels().list(part="snippet", mine=True).execute().get("items", [])
              if not items:
                  print("ERROR: token works but no YouTube channel found."); sys.exit(1)
              print("OK: token valid for channel:", items[0]["snippet"]["title"])
          except Exception as e:
              print("ERROR:", e); sys.exit(1)
          PYEOF
      - name: Open an issue if the token is dead
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="YouTube OAuth token expired or revoked - re-authorize now"
          if gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' | grep -qx 0; then
            gh issue create --title "$TITLE" --body "The daily token check failed (see the run log). Videos will fail until this is fixed.

          1. Google Cloud Console -> OAuth consent screen / Audience -> make sure Publishing status is **In production** (Testing = tokens die after 7 days).
          2. On your computer run: \`python reauth_youtube.py --push-secret\` (or paste token.json into the GOOGLE_CREDENTIALS secret).
          3. Re-run this workflow; then re-run the failed upload if needed."
          else
            echo "An open issue already exists - not creating another."
          fi
          exit 1
